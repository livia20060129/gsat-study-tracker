name: Build native test apps

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform to verify
        type: choice
        options: [both, android, ios]
        default: both

permissions:
  contents: read

jobs:
  android:
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm run native:sync
      - run: npm run native:check
      - run: chmod +x android/gradlew
      - run: node --experimental-strip-types scripts/buildNative.ts android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gsat-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: xcodebuild -version
      - run: npm ci
      - run: npm run native:sync
      - run: npm run native:check
      - run: node --experimental-strip-types scripts/buildNative.ts ios
