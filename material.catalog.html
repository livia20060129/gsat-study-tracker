<!doctype html>
<html lang="zh-Hant">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f8fc"><link rel="icon" href="./book.png"><title>新增／管理教材目錄｜GSAT Study Tracker</title></head>
<body>
<main class="catalog-page">
  <header class="catalog-header"><div><h1>新增／管理教材目錄</h1><p id="catalogScope"></p></div><nav><a href="./index.html">回到 Tracker</a><a href="./material.progress.html">教材進度圖</a></nav></header>
  <p class="catalog-note">教材設定會隨目前帳號的讀書紀錄保存。訪客新增的教材會在登入後帶入；刪除目錄不會刪除已填寫的讀書紀錄。</p>
  <div class="catalog-toolbar"><label>搜尋教材<input id="catalogSearch" type="search" placeholder="輸入書名或科目"></label><label>科目<select id="catalogFilter"><option value="">全部科目</option></select></label><button id="newMaterial" type="button">新增教材</button></div>
  <p id="catalogStatus" role="status" aria-live="polite"></p><p id="catalogError" role="alert" hidden></p>
  <section id="catalogEditor" class="catalog-panel" aria-labelledby="catalogEditorTitle" hidden>
    <h2 id="catalogEditorTitle">新增教材</h2>
    <form id="catalogForm">
      <div class="catalog-fields"><label>書名<input id="catalogTitle" required maxlength="180"></label><label>科目<select id="catalogSubject" required></select></label><label>分類<select id="catalogGroup"></select></label><label>範圍模板<select id="catalogMode"><option value="pages">頁碼</option><option value="unit">Unit</option><option value="round">回次</option></select></label><label><span id="catalogTotalLabel">總頁數</span><input id="catalogTotal" type="number" min="1" max="10000" step="1" required></label></div>
      <h3>章節對照</h3><p class="catalog-note">相同大單元可分列小主題。進度圖依大單元分界；紀錄卡輸入範圍時顯示小主題。章節可留空，範圍不得重疊。</p>
      <div id="catalogSections"></div><button id="addCatalogSection" type="button">新增章節</button>
      <div class="catalog-editor-actions"><button type="submit">儲存教材</button><button id="cancelCatalogEdit" type="button" class="secondary">取消編輯</button></div>
    </form>
  </section>
  <section aria-labelledby="catalogListTitle"><h2 id="catalogListTitle">教材目錄</h2><div id="catalogList"></div></section>
</main><script type="module" src="/src/material-catalog-page.ts"></script>
</body></html>
